# 역할
#  - JVM 힙 (테스트 / 컴파일 시 OutOfMemory 방지) + Android X / R 클래스 정책 + Maven 좌표 공통값.
#  - 모듈마다 mavenPublishing 블록에서 GROUP / VERSION_NAME 을 가져다 쓴다.
#
# 주의사항
#  - VERSION_NAME 은 단계마다 일괄 갱신 (1단계 끝 → 0.1.0, 2단계 끝 → 0.2.0 ···).
#  - vanniktech maven-publish 플러그인이 POM_* 값을 자동으로 POM 에 채운다.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 부터 Kotlin 이 기본 내장 + 새 DSL 이 기본이지만, 우리는 명시적으로 둘 다 끈다.
#  - 사유: 라이브러리가 SolTi (사용처) 와 같은 Kotlin 2.3.20 을 고정해서 쓰려면
#    libs.versions.toml 의 kotlin 버전이 그대로 적용되도록 explicit kotlin-android 플러그인 경로가 안전하다.
#  - 내장 Kotlin / 새 DSL 로 가면 AGP 가 묶고 있는 Kotlin / DSL 버전에 따라가게 되어 SolTi 와 어긋날 수 있다.
#  - AGP 10 로 갈 때 일괄 마이그레이션 (이 두 줄 제거 + kotlin-android 플러그인 제거).
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official

# Maven 좌표 — 모든 모듈 공통
GROUP=kr.co.junu
VERSION_NAME=0.2.2

# POM 메타 — vanniktech 가 POM_* 표준 키를 읽음
POM_DESCRIPTION=Shared Android library bundle for indie apps (analytics / ads / network / billing / auth).
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/junu-labs/indie-kit-android

POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/junu-labs/indie-kit-android
POM_SCM_CONNECTION=scm:git:git://github.com/junu-labs/indie-kit-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/junu-labs/indie-kit-android.git

POM_DEVELOPER_ID=junu-labs
POM_DEVELOPER_NAME=Junu Labs
POM_DEVELOPER_URL=https://github.com/junu-labs
