# 역할
#  - indie-kit-android 의 모든 모듈이 같은 버전 카탈로그를 본다.
#  - 0단계 (부트스트랩) 엔 외부 의존성 0개. junit + 빌드 도구 3개 (AGP / Kotlin / maven-publish) 만 등록.
#  - 1단계 (Analytics) 진입 시 firebase-bom 추가, 2단계 (Ads) 시 compose-bom + play-services-ads,
#    3단계 (Network) 시 okhttp 또는 ktor, 4단계 (Billing) 시 billing-ktx,
#    5단계 (Auth) 시 google-id / kakao 가 각각 그 모듈 build.gradle.kts 에만 추가된다.
#
# 주의사항
#  - 데모 (IndieKitDemo_Android) 와 같이 composite build 로 한 데몬 안에서 도는 환경 (settings.gradle.kts 의
#    includeBuild) 에서는 두 빌드의 AGP 가 같아야 한다 (Gradle 의 AgpVersionCompatibilityRule 가 차이 거부).
#    데모가 9.1.1 로 올라간 시점에 라이브러리도 9.1.1 로 정렬. 라이브러리 산출물 (.aar) 자체엔 영향 없음.

[versions]
# AGP / Kotlin 은 툴체인 — 올리면 이 .aar 를 받는 앱들도 같은 버전(이상)으로 맞춰야 한다.
# AGP 는 Android Studio 가 지원하는 최신까지만 (그보다 높이면 스튜디오가 프로젝트를 못 연다).
# 2026-07 스튜디오 업데이트 후 9.3.0 지원 확인.
agp = "9.3.0"
kotlin = "2.4.10"
junit = "4.13.2"
mavenPublish = "0.37.0"

# 1단계 추가 — Firebase Analytics. SolTi 와 같은 BOM 으로 묶어 Crashlytics 등 형제 라이브러리도 같은 시점 일치.
firebaseBom = "34.16.0"

# 2단계 추가 — AdMob (배너 / 전면 / 리워드 / Native) + UMP (유럽 광고 동의창) + Compose.
playServicesAds = "25.4.0"
userMessagingPlatform = "4.0.0"
composeBom = "2026.06.01"
# coreKtx 1.19.0 은 compileSdk 37 을 요구 — 모듈 compileSdk 37 과 함께 감 (앱들도 37 로 컴파일해야 함).
coreKtx = "1.19.0"

# androidx.fragment — 우리 코드는 안 쓰지만, 광고 / 통계 모듈이 끌어오는 Google Play Services
# (play-services-basement) 가 옛 fragment 1.1.0 을 추이로 딸려 온다. Play Console 이 "오래된 SDK
# (fragment 1.1.0)" 경고를 내므로, 최신을 직접 좌표로 넣어 밀어낸다 (indie-kit-ads 에 implementation).
fragment = "1.8.9"

# 3단계 추가 — Network (OkHttp + kotlinx.serialization + kotlinx.coroutines).
#  - okhttp: 검증된 HTTP 클라이언트. SolTi / TapCounter 도 같은 계열.
#  - kotlinx-serialization-json: @Serializable data class 의 JSON 인코딩 / 디코딩.
#  - kotlinx-coroutines-core: suspend 함수 + withContext(Dispatchers.IO). 사용처도 같이 끌고 가야 하므로 api 노출.
#  - kotlin-serialization plugin 의 버전은 Kotlin 컴파일러와 같이 간다 (plugins 절 참고).
okhttp = "5.4.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"

# 4단계 추가 — Billing (Google Play Billing).
#  - billing-ktx: Play Billing 의 Kotlin 확장. suspend / coroutines 친화 헬퍼 포함.
#  - 사용처 (앱) 가 Play Billing 의 BillingClient / ProductDetails 등을 직접 만지는 경우가 있어 api 노출.
#  - v9.1.0 (안정 최신). 구글 정책상 2026-08-31 부터 8.0.0 이상 필수라 7.1.1 → 9.1.0 으로 올림.
playBilling = "9.1.0"

# 5단계 추가 — Auth (Google Credential Manager + Kakao SDK).
#  - androidx.credentials: Android 14+ 표준 인증 API. 옛 play-services-auth 의 후속.
#  - credentials-play-services-auth: Credential Manager 가 Google Identity Services 와 통신할 수 있게 잇는 어댑터.
#  - googleid: "Sign in with Google" 의 Credential 옵션 (GetGoogleIdOption). Credential Manager 와 같이 사용.
#  - kakao SDK: 카카오 로그인 본체 (v2-user + v2-auth + v2-common).
#  - 모두 안드로이드 전용. iOS 자매와 같은 API 모양 (configure / signIn / signOut / unlink) 으로 감쌈.
androidxCredentials = "1.6.0"
googleId = "1.2.0"
kakaoSdk = "2.24.0"

# 6단계 추가 — Push (알림 권한 / FCM 알림 주소 / 수신·누름 / 로컬 예약 알림).
#  - firebase-messaging: FCM 본체 (알림 주소 발급 + 수신 서비스). 버전은 firebase-bom 이 관리.
#  - androidx-activity: requestPermission 이 권한 팝업 결과를 받으려면 ComponentActivity 의
#    activityResultRegistry 가 필요. Compose 앱은 이미 ComponentActivity 기반이라 추가 부담 없음.
androidxActivity = "1.13.0"

[libraries]
# 단위 테스트 — 모든 모듈 공용 (모듈마다 PlaceholderTest 또는 실제 테스트에서 사용).
junit = { group = "junit", name = "junit", version.ref = "junit" }

# 1단계 IndieKitAnalytics 가 끌어 쓸 Firebase 라이브러리.
#  - firebase-bom: 모든 firebase-* 모듈의 버전을 한 줄로 통일.
#  - firebase-analytics: 통계 본체. Kotlin extensions 포함되어 있어 별도 -ktx 없이 사용 가능.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

# 2단계 IndieKitAds 가 끌어 쓸 AdMob / UMP / Compose 라이브러리.
#  - play-services-ads: AdMob 본체 (배너 + 전면 + 리워드 + Native).
#  - user-messaging-platform: UMP (유럽 사용자 광고 동의창).
#  - compose-bom: Compose 모든 모듈을 한 시점으로 묶기 위함. SolTi 와 같은 시점.
#  - androidx-compose-foundation / material3 / ui / ui-tooling-preview: BannerAdView / NativeAdView 의 Compose 진입점에 필요.
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "userMessagingPlatform" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# 광고 / 통계 모듈이 끌어오는 Google Play Services 의 옛 fragment 1.1.0 을 밀어내기 위한 직접 좌표 (위 fragment 주석 참고).
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }

# 3단계 IndieKitNetwork 가 끌어 쓸 OkHttp / 직렬화 라이브러리.
#  - okhttp: HTTP 본체. 사용처가 raw Request / Response 를 직접 다룰 수 있게 api 노출.
#  - kotlinx-serialization-json: @Serializable 어노테이션을 사용처가 자기 자료에 붙여 쓰므로 api 노출.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# 4단계 IndieKitBilling 가 끌어 쓸 Google Play Billing 라이브러리.
#  - billing-ktx: Play Billing 의 Kotlin 확장. BillingClient / ProductDetails / Purchase 등 사용처 노출 형이라 api.
play-billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "playBilling" }

# 5단계 IndieKitAuth 가 끌어 쓸 Credential Manager / Google ID / Kakao SDK.
#  - androidx-credentials: Credential Manager 본체.
#  - credentials-play-services-auth: Play Services 인증 어댑터 — Credential Manager 가 Google 계정에 접근.
#  - googleid: GetGoogleIdOption + Google ID Token 자료 모델.
#  - kakao-user / kakao-auth / kakao-common: 카카오 로그인 (카카오톡 앱 / 웹뷰 분기) + 토큰 / 프로필 API.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
kakao-user = { group = "com.kakao.sdk", name = "v2-user", version.ref = "kakaoSdk" }

# 6단계 IndieKitPush 가 끌어 쓸 FCM / Activity 라이브러리.
#  - firebase-messaging: 알림 주소 (등록 토큰) 발급 + 수신 서비스. 버전은 firebase-bom.
#  - androidx-activity: 알림 권한 팝업 (Android 13+) 결과 수신용 ActivityResultRegistry.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidxActivity" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android  = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose  = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# 3단계 — @Serializable 코드 생성 플러그인. Kotlin 컴파일러와 같은 버전으로 묶임.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
maven-publish   = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
